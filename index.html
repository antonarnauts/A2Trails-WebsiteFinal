<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="description" content="Professional construction of riding infrastructure - helping municipalities, developers, and holiday parks create vibrant, active outdoor spaces" />
    <meta property="og:title" content="A2Trails | Professional Mountain Bike Infrastructure" />
    <meta property="og:description" content="Professional construction of riding infrastructure - helping municipalities, developers, and holiday parks create vibrant, active outdoor spaces" />
    <link id="favicon-icon" rel="icon" type="image/webp" href="./images/logo.webp" />
    <link id="favicon-shortcut" rel="shortcut icon" type="image/webp" href="./images/logo.webp" />
    <link id="favicon-apple" rel="apple-touch-icon" href="./images/logo.webp" />
    <title>A2Trails | Professional Mountain Bike Infrastructure</title>
    <script>
      (function() {
        var h = window.location.hash.toLowerCase();
        var host = window.location.hostname.toLowerCase();
        var path = window.location.pathname.toLowerCase();
        if (h.indexOf('a2gardens') !== -1 || host.indexOf('a2gardens') !== -1 || path.indexOf('a2gardens') !== -1) {
          var a2gLogo = './a2gardens/images/logoa2gardernspng.png';
          var iconEl = document.getElementById('favicon-icon');
          var shortcutEl = document.getElementById('favicon-shortcut');
          var appleEl = document.getElementById('favicon-apple');
          if (iconEl) { iconEl.type = 'image/png'; iconEl.href = a2gLogo; }
          if (shortcutEl) { shortcutEl.type = 'image/png'; shortcutEl.href = a2gLogo; }
          if (appleEl) { appleEl.href = a2gLogo; }
          document.title = 'A2Gardens | Brussels Garden Architecture & Terraces';
        }
      })();
    </script>
  </head>
  <body>
    <script>
      (function() {
        if (window.location.hash && (window.location.hash.match(/#\//g) || []).length > 1) {
          var parts = window.location.hash.split('#/').filter(Boolean);
          if (parts.length > 0) {
            window.location.hash = '#/' + parts[0];
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
