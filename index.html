    <link id="favicon-shortcut" rel="shortcut icon" type="image/webp" href="./images/logo.webp" />
    <link id="favicon-apple" rel="apple-touch-icon" href="./images/logo.webp" />
    <title>A2Trails | Professional Mountain Bike Infrastructure</title>
    <script>
      (function() {
        var h = window.location.hash.toLowerCase();
        var host = window.location.hostname.toLowerCase();
        var path = window.location.pathname.toLowerCase();
        if (h.indexOf('a2gardens') !== -1 || h.indexOf('/gardens') !== -1 || host.indexOf('a2gardens') !== -1 || path.indexOf('a2gardens') !== -1 || path.indexOf('/gardens') !== -1) {
          if (window.location.hash) {
            var cleanTarget = host.indexOf('a2gardens') !== -1 ? '/' : '/a2gardens';
            window.history.replaceState(null, '', cleanTarget + window.location.search);
          }
          var a2gLogo = './a2gardens/images/logoa2gardernspng.png';
          var absLogo = window.location.origin + '/a2gardens/images/logoa2gardernspng.png';
          var a2gTitle = 'A2Gardens | Garden Architect Brussels – City Gardens & Terraces';
          var a2gDesc = 'Landscape architect Anton Arnauts (A2Gardens) designs and builds bespoke city gardens, natural stone terraces, rooftop gardens, and balconies across all 19 Brussels communes.';
          var iconEl = document.getElementById('favicon-icon');
          var shortcutEl = document.getElementById('favicon-shortcut');
          var appleEl = document.getElementById('favicon-apple');
          if (iconEl) { iconEl.type = 'image/png'; iconEl.href = a2gLogo; }
          if (shortcutEl) { shortcutEl.type = 'image/png'; shortcutEl.href = a2gLogo; }
          if (appleEl) { appleEl.href = a2gLogo; }
          var setMeta = function(id, val) {
            var el = document.getElementById(id);
            if (el) el.setAttribute('content', val);
          };
          setMeta('meta-description', a2gDesc);
          setMeta('og-site-name', 'A2Gardens');
          setMeta('og-title', a2gTitle);
          setMeta('og-description', a2gDesc);
          setMeta('og-image', absLogo);
          setMeta('og-image-secure', absLogo);
          setMeta('og-image-type', 'image/png');
          setMeta('twitter-title', a2gTitle);
          setMeta('twitter-description', a2gDesc);
          setMeta('twitter-image', absLogo);
          document.title = a2gTitle;
        }
      })();
    </script>
  </head>
  <body>
    <script>
      (function() {
        if (window.location.hash && (window.location.hash.match(/#\//g) || []).length > 1) {
          var parts = window.location.hash.split('#/').filter(Boolean);
          if (parts.length > 0) {
            window.location.hash = '#/' + parts[0];
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
